services:
  postgres:
    image: postgres:17-alpine
    container_name: unicon-passwordless-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unicon_passwordless
    ports:
      - '5434:5432'
    volumes:
      - postgres_passwordless_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    container_name: unicon-postgres-test
    profiles:
      - test
    environment:
      POSTGRES_USER: unicon_e2e
      POSTGRES_PASSWORD: unicon_e2e_local
      POSTGRES_DB: unicon_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unicon_e2e -d unicon_test']
      interval: 2s
      timeout: 5s
      retries: 15

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7.1.1
    profiles:
      - tools
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_DB_DIR: /usr/share/GeoIP
    volumes:
      - ./data/geoip:/usr/share/GeoIP

volumes:
  postgres_passwordless_data:
  postgres_test_data:
